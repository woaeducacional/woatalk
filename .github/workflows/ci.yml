name: WOA Talk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run dev > /tmp/woa.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://localhost:3000

      - name: Run Cypress Smoke Tests
        run: npx cypress run --spec "cypress/e2e/smoke/*.feature"
